<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Gaussian Viewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <header id="toolbar">
      <button id="btn-open" class="tb-btn" title="Open splat / zip">Open</button>
      <input
        id="file-input"
        type="file"
        accept=".spz,.ply,.splat,.ksplat,.sog,.zip"
        hidden
      />
      <select id="view-select" class="tb-select" title="Captured views" hidden></select>
      <button id="btn-reset" class="tb-btn" title="Reset view">Reset</button>
      <label class="tb-speed" title="Move speed">
        <span>Speed</span>
        <input id="speed" type="range" min="-2" max="2" step="0.1" value="0" />
        <b id="sprint-badge" hidden>×3</b>
      </label>
      <button id="btn-gyro" class="tb-btn" title="Look around by tilting the device" hidden>Gyro</button>
      <button id="btn-flip" class="tb-btn" title="Flip scene upside down (for OpenCV-convention PLY)">Flip</button>
      <button id="fps" class="tb-btn" type="button" data-level="good">
        <span class="fps-main"><b class="fps-value">--</b> FPS</span>
        <span class="fps-detail"><span class="fps-ms"></span> <span class="fps-splats"></span></span>
      </button>
    </header>

    <div id="status" hidden>
      <div id="status-text"></div>
      <div id="progress"><div id="progress-bar"></div></div>
    </div>

    <div id="empty-hint">
      <p>Open or drop a Gaussian splat<br /><small>.spz · .ply · .splat · .ksplat · .sog · viewfinder .zip</small></p>
    </div>

    <div id="drop-overlay" hidden><p>Drop to load</p></div>

    <div id="dial" class="ctrl" aria-label="Move">
      <div id="dial-ring">
        <span class="arrow n"></span>
        <span class="arrow e"></span>
        <span class="arrow s"></span>
        <span class="arrow w"></span>
      </div>
      <div id="dial-base"></div>
      <div id="dial-knob"></div>
    </div>

    <div id="elevator" class="ctrl">
      <button id="btn-up" aria-label="Up">
        <svg viewBox="0 0 24 24"><path d="M12 6 4 16h16z" /></svg>
      </button>
      <button id="btn-down" aria-label="Down">
        <svg viewBox="0 0 24 24"><path d="M12 18 4 8h16z" /></svg>
      </button>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
